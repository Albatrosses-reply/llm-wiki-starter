name: test
on: [push, pull_request]
jobs:
  offline:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python ${{ runner.os == 'Windows' && '.venv\Scripts\python.exe' || '.venv/bin/python' }} -e .
      - name: offline tests
        run: ${{ runner.os == 'Windows' && '.venv\Scripts\python.exe' || '.venv/bin/python' }} -m unittest discover -s tests -v
        env:
          PYTHONUTF8: "1"
      - name: wiki help
        run: ${{ runner.os == 'Windows' && '.\wiki.cmd' || './wiki.sh' }} --help
      - name: setup dry run (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\setup.ps1 -DryRun
